[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["smoltrace", "smoltrace.exporters"]

[project]
name = "smoltrace"
version = "0.2.0"
authors = [
    {name = "Kshitij Thakkar", email = "kshitijthakkar@rocketmail.com"}
]
description = "A comprehensive benchmarking and evaluation framework for smolagents."
readme = "README.md"
# 3.11 floor since 0.2.0. litellm -- pulled in transitively by smolagents'
# LiteLLMModel -- imports `NotRequired` from `typing`, which is 3.11+, so the
# whole `run_evaluation` path failed to import on 3.10. Claiming 3.10 support
# while the primary entry point raises ImportError is worse than dropping it.
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "smolagents>=1.0.0",
    "datasets",
    "huggingface_hub",
    "opentelemetry-sdk",
    "genai-otel-instrument[openinference]>=1.6.1,<2.0.0",
    "duckduckgo-search",
    "ddgs"
]

[project.optional-dependencies]
gpu = [
    "genai-otel-instrument[gpu]>=1.6.1,<2.0.0",
    "nvidia-ml-py",
    "transformers>=4.36.0",
    "torch>=2.0.0",
    "accelerate>=0.20.0"
]
opensearch = [
    "opensearch-py>=2.4.0",
]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "pytest-asyncio>=0.21.1",

    # Code quality
    "black>=23.7.0",
    "isort>=5.12.0",
    "pylint>=2.17.5",
    "ruff>=0.0.285",
    "mypy>=1.4.1",
    "pre-commit>=3.5.0",

    # Build and release
    "build>=0.10.0",
    "twine>=4.0.2",

    # Security. pip-audit rather than safety: safety 3.x deprecated `safety
    # check` and requires an authenticated account, which a public CI job on an
    # OSS repo has no way to supply. pip-audit reads the PyPI advisory / OSV
    # data with no account at all.
    "pip-audit>=2.7.0",
    "bandit>=1.7.5",
]

[project.urls]
"Homepage" = "https://github.com/Mandark-droid/SMOLTRACE"
"Documentation" = "https://mandark-droid.github.io/SMOLTRACE/"
"Bug Tracker" = "https://github.com/Mandark-droid/SMOLTRACE/issues"
"Changelog" = "https://mandark-droid.github.io/SMOLTRACE/community/changelog/"


[project.scripts]
smoltrace-eval = "smoltrace.cli:main"
smoltrace-cleanup = "smoltrace.cleanup:main"
smoltrace-copy-datasets = "smoltrace.copy_datasets:main"

[tool.black]
line-length = 100
# PIN THE TARGET. Without it black infers one, and a newer local black inferred
# a newer Python than CI's black could parse -- CI failed with "Python 3.11
# cannot parse code formatted for Python 3.15" on an unchanged file. Pinning
# makes formatting deterministic across black versions and developer machines.
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"
